# Blueprint Render — API SIM-BIOMED (backend Django/Gunicorn/Celery)
# Tous les services sont en region: frankfurt, la même zone que le projet
# Supabase (eu-west-2 / Londres) : ne pas changer la région, elle est
# figée après la première création.
# PostgreSQL est externe (Supabase) : renseigner DATABASE_URL dans le dashboard
# Render (sync: false), jamais dans ce fichier — mode Pooler SESSION, ?sslmode=require.
services:
  - type: web
    name: simbiomed-api
    region: frankfurt
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile.prod
    dockerContext: .
    healthCheckPath: /api/healthz/
    autoDeployTrigger: 'commit'
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # ALLOWED_HOSTS et CSRF_TRUSTED_ORIGINS ne sont pas déclarés ici :
      # RENDER_EXTERNAL_HOSTNAME (injecté par Render, suffixé ou non) les
      # renseigne à l'exécution via config/settings/origins.py.
      #
      # Origine de l'interface : alimente CORS_ALLOWED_ORIGINS et
      # CSRF_TRUSTED_ORIGINS. Le proxy nginx envoie Host = api alors que le
      # navigateur vient du front : sans cette origine, Django refuse la
      # comparaison Origin/Host (403 CSRF). À corriger après la création du
      # service frontend (sync: false = Render ne reprend pas la main dessus).
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: simbiomed-redis
          type: keyvalue
          property: connectionString
      - key: RUN_MIGRATIONS
        value: "true"
      - key: RUN_COLLECTSTATIC
        value: "true"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: LOG_LEVEL
        value: INFO

  - type: worker
    name: simbiomed-worker
    region: frankfurt
    runtime: docker
    dockerfilePath: ./Dockerfile.prod
    dockerContext: .
    startCommand: celery -A config worker --loglevel=info --concurrency=2
    autoDeployTrigger: 'commit'
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        fromService:
          name: simbiomed-api
          type: web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromService:
          name: simbiomed-api
          type: web
          envVarKey: DATABASE_URL
      - key: REDIS_URL
        fromService:
          name: simbiomed-redis
          type: keyvalue
          property: connectionString
      - key: RUN_MIGRATIONS
        value: "false"
      - key: RUN_COLLECTSTATIC
        value: "false"
      - key: LOG_LEVEL
        value: INFO

  - type: worker
    name: simbiomed-beat
    region: frankfurt
    runtime: docker
    dockerfilePath: ./Dockerfile.prod
    dockerContext: .
    startCommand: celery -A config beat --loglevel=info
    autoDeployTrigger: 'commit'
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        fromService:
          name: simbiomed-api
          type: web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromService:
          name: simbiomed-api
          type: web
          envVarKey: DATABASE_URL
      - key: REDIS_URL
        fromService:
          name: simbiomed-redis
          type: keyvalue
          property: connectionString
      - key: RUN_MIGRATIONS
        value: "false"
      - key: RUN_COLLECTSTATIC
        value: "false"
      - key: LOG_LEVEL
        value: INFO

  # Broker Celery : le worker et le beat ne peuvent pas démarrer sans lui.
  # ipAllowList vide = connexions internes uniquement (réseau privé Render),
  # ce qui impose la même région que les services. noeviction : une file de
  # tâches ne doit jamais perdre un message par éviction.
  - type: keyvalue
    name: simbiomed-redis
    region: frankfurt
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []
