# Blueprint Render — TEST GRATUIT (tier gratuit : web services seulement)
# Variante de render.yaml sans worker ni beat (background workers payants).
#
# Ce qui est sauté : les tâches Celery planifiées de preventive
#   - check_overdue_maintenance (quotidien, 6 h)
#   - generate_preventive_schedule (mensuel, le 1er à 7 h)
# À déclencher à la main depuis la console du service :
#   python manage.py shell -c "from apps.preventive.tasks import check_overdue_maintenance as f; print(f())"
#
# Pour repasser en complet (worker + beat) : utiliser render.yaml.
services:
  - type: web
    name: simbiomed-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.prod
    dockerContext: .
    healthCheckPath: /api/healthz/
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: simbiomed-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://simbiomed-frontend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://simbiomed-api.onrender.com
      # Supabase : Settings → Database → Connection string (URI), mode Pooler,
      # avec ?sslmode=require en suffixe. À saisir ici, jamais dans le dépôt.
      - key: DATABASE_URL
        sync: false
      - key: RUN_MIGRATIONS
        value: "true"
      - key: RUN_COLLECTSTATIC
        value: "true"
      # Instance gratuite : 512 Mo de RAM, un seul worker Gunicorn.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: LOG_LEVEL
        value: INFO
